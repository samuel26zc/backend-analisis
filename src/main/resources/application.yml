server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: backend-analisis

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:analisis_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

# Configuración de logs
logging:
  level:
    com.analisis.backend: INFO
    org.springframework.web: INFO
